name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v1.0.0)'
        required: true
      notes:
        description: 'Release notes (optional)'
        required: false
      generate_notes:
        description: 'Check this box to automatically generate notes'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-electron:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            electronFlags: --linux --x64
          - os: windows-latest
            rid: win-x64
            electronFlags: --win --x64
          - os: macos-latest
            rid: osx-x64
            electronFlags: --mac --x64
          - os: macos-latest
            rid: osx-arm64
            electronFlags: --mac --arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish self-contained backend sidecar (${{ matrix.rid }})
        run: >
          dotnet publish src/Chiaroscuro.Api/Chiaroscuro.Api.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o app/apps/electron/resources/backend/${{ matrix.rid }}

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build renderer
        working-directory: app
        run: npm run build --workspace apps/renderer

      - name: Build Electron main/preload
        working-directory: app
        run: npm run build --workspace apps/electron

      - name: Package Electron app (${{ matrix.rid }})
        working-directory: app/apps/electron
        run: npx electron-builder ${{ matrix.electronFlags }}

      - uses: actions/upload-artifact@v4
        with:
          name: Chiaroscuro-${{ matrix.rid }}
          path: |
            app/apps/electron/out/*.exe
            app/apps/electron/out/*.dmg
            app/apps/electron/out/*.AppImage
          if-no-files-found: error

  release:
    needs: [build-electron]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine release tag
        id: vars
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: echo "tag=${INPUT_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.vars.outputs.tag }}
          NOTES: ${{ github.event.inputs.notes }}
          GEN_NOTES: ${{ github.event.inputs.generate_notes }}
        run: |
          args=(--title "Chiaroscuro $TAG")
          if [ -n "$NOTES" ]; then
            args+=(--notes "$NOTES")
          fi
          if [ -n "$GEN_NOTES" ]; then
            args+=(--generate-notes)
          fi
          gh release create "$TAG" artifacts/* "${args[@]}"
