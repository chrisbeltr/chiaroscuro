name: Deploy Wasm to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install wasm-tools workload
        run: dotnet workload install wasm-tools

      - name: Restore
        run: dotnet restore src/Chiaroscuro.Wasm/Chiaroscuro.Wasm.csproj

      - name: Publish
        run: >
          dotnet publish src/Chiaroscuro.Wasm/Chiaroscuro.Wasm.csproj
          -c Release
          --no-restore
          -o publish

      - id: pages
        uses: actions/configure-pages@v5

      - name: Rewrite <base href> for the Pages subpath
        run: |
          sed -i 's|<base href="/" />|<base href="${{ steps.pages.outputs.base_path }}/" />|' publish/wwwroot/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
