appId: com.chiaroscuro.app
productName: Chiaroscuro
# Explicit so every platform's installer clearly states OS and architecture in the
# filename itself (e.g. Chiaroscuro-2.0.0-win-x64.exe, Chiaroscuro-2.0.0-mac-arm64.dmg)
# rather than relying on the file extension alone - and so the two mac builds (x64 vs
# arm64) don't collide, which the default "${productName}-${version}-${arch}.${ext}"
# pattern would risk without ${os} in it.
artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
directories:
  buildResources: build
  output: out
# dist/main.js's __dirname resolves to <asar-root>/dist at runtime, and main.ts loads
# "../renderer/index.html" relative to that - so the renderer's built output must land at
# <asar-root>/renderer, matching the `to: renderer` mapping below.
files:
  - from: dist
    to: dist
  - from: ../renderer/dist
    to: renderer
  - package.json
# Per-RID self-contained Chiaroscuro.Api publishes, placed here by a `dotnet publish`
# step (see the migration plan's CI/CD section) before running `npm run package`. Not
# checked into source control - see the root .gitignore entry for this path.
extraResources:
  - from: resources/backend
    to: backend
win:
  target: nsis
  icon: build/icon.ico
mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity
linux:
  executableName: "chiaroscuro-electron"
  target: AppImage
  icon: build/icon.png
  category: Utility
